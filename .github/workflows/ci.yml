name: CI

# Runs on every pull request. Its main job is a teaching-friendly "secret guard":
# it FAILS the PR if a .env file (or an obvious hardcoded key) was committed.
# This gives students real CI feedback that reinforces the Practical session.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Fail if a .env file was committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::A .env file is tracked by Git. Remove it and add '.env' to .gitignore."
            exit 1
          fi
          echo "OK: no tracked .env file."

      - name: Scan for obvious hardcoded secrets
        run: |
          # Very simple heuristic scan across the tracked source files.
          if git grep -nEI '(SECRET|API_KEY|PASSWORD|TOKEN)[[:space:]]*=[[:space:]]*["'"'"'][^"'"'"']{8,}' \
               -- 'index.html' 'style.css' 'script.js' 2>/dev/null; then
            echo "::error::Possible hardcoded secret found in source. Move it to a .env file."
            exit 1
          fi
          echo "OK: no obvious hardcoded secrets in source files."

  html-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Basic sanity check
        run: |
          test -f index.html && echo "index.html present"
          test -f style.css && echo "style.css present"
          test -f script.js && echo "script.js present"
