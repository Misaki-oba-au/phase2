<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notepad — AI Native Workforce Program</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>📝 Notepad</h1>
      <p class="app__subtitle">A simple notepad app. Add, edit, and delete your notes.</p>
    </header>

    <section class="composer">
      <textarea id="note-input" class="composer__input" placeholder="Write a note..."></textarea>
      <!-- Basics exercise: ask AI to turn this "Add" button red -->
      <button id="add-btn" class="btn btn--add">Add</button>
    </section>

    <ul id="note-list" class="note-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
